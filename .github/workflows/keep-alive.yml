name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 */3 * *'   # every 3 days at midnight UTC — comfortably under the 7-day pause window
  workflow_dispatch: {}      # lets you also trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase listings table
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/listings?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase responded with HTTP $STATUS"
          if [ "$STATUS" -ge 400 ]; then
            echo "::warning::Supabase ping returned an error status — check your project isn't already paused or credentials aren't stale."
          fi
