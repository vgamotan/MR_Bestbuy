<div id="root"></div>

<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = (id) => document.getElementById(id);
const escapeHtml = (s) => s === null || s === undefined ? "" : String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

let session = null;
let profile = null;
let listings = [];
let expandedId = null;
let editingId = null;
let adminTab = "listings"; // listings | archive | approvals | reports
let searchLogTimer = null;
let pendingProfiles = [];
let searchLogs = [];
let profilesById = {};
let agentNames = []; // shared lookup pool for Site Locator / Recruited By / Unit Manager / Division Manager / Sub Broker
let filterRegions = [];   // multi-select
let filterCities = [];    // multi-select
let filterCategories = []; // multi-select, stores category ids
let filterStatuses = [];   // multi-select
let priceMin = null;      // current slider selection (Selling Price)
let priceMax = null;
let priceDataMin = 0;     // actual bounds from loaded listings
let priceDataMax = 0;
let formValues = {};    // in-progress Add/Edit form state for combobox-controlled fields

function categoryLabel(id) { const c = CATEGORIES.find((x) => x.id === id); return c ? c.label : id; }
function statusColor(s) { return { Available: "#1F7A4D", Reserved: "#B98B2A", Sold: "#8A8478" }[s] || "#8A8478"; }
function photoList(str) { return (str || "").split("\n").map((s) => s.trim()).filter(Boolean); }
function driveFileId(url) {
  if (!url) return null;
  let m = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);       // .../file/d/FILE_ID/view
  if (m) return m[1];
  m = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);                 // ...?id=FILE_ID or open?id=FILE_ID
  if (m) return m[1];
  return null;
}
function driveImageSrc(url) {
  const id = driveFileId(url);
  return id ? `https://lh3.googleusercontent.com/d/${id}` : url; // falls back to raw url if not recognized
}
function isDriveLink(url) { return /drive\.google\.com/i.test(url || ""); }

// =====================================================================
// COMBOBOX ENGINE — reusable search + dropdown + multi-select + create
// =====================================================================
const comboRegistry = {}; // id -> { options(): string[], getSelected(): string[], setSelected(arr), multi, allowCreate, onCreate?(name), onChange?(), placeholder }
const comboUi = {};       // id -> { query: string, open: boolean }

function registerCombo(id, config) {
  comboRegistry[id] = config;
  if (!comboUi[id]) comboUi[id] = { query: "", open: false };
}
function comboFilteredOptions(id) {
  const cfg = comboRegistry[id];
  const opts = cfg.options();
  const q = comboUi[id].query.trim().toLowerCase();
  return q ? opts.filter((o) => o.toLowerCase().includes(q)) : opts;
}
function comboHTML(id) {
  const cfg = comboRegistry[id];
  const ui = comboUi[id];
  const selected = cfg.getSelected();
  const filtered = comboFilteredOptions(id);
  const queryTrim = ui.query.trim();
  const exactMatch = cfg.options().some((o) => o.toLowerCase() === queryTrim.toLowerCase());
  const showCreate = cfg.allowCreate && queryTrim && !exactMatch;
  const inputValue = cfg.multi ? ui.query : (ui.open ? ui.query : (selected[0] || ""));
  const chips = cfg.multi && selected.length
    ? `<div class="combo-chips">${selected.map((v) => `<span class="combo-chip">${escapeHtml(v)}<button type="button" data-combo-remove="${id}" data-value="${escapeHtml(v)}">&times;</button></span>`).join("")}</div>`
    : "";
  return `<div class="combo">
    ${chips}
    <input class="combo-input" data-combo-input="${id}" placeholder="${escapeHtml(cfg.placeholder || "Search...")}" value="${escapeHtml(inputValue)}" autocomplete="off" />
    ${ui.open ? `<div class="combo-dropdown">
      ${filtered.map((o) => `<div class="combo-option${selected.includes(o) ? " selected" : ""}" data-combo-option="${id}" data-value="${escapeHtml(o)}">${cfg.multi ? (selected.includes(o) ? "☑ " : "☐ ") : ""}${escapeHtml(o)}</div>`).join("")}
      ${showCreate ? `<div class="combo-option combo-create" data-combo-create="${id}">+ Add "${escapeHtml(queryTrim)}"</div>` : ""}
      ${filtered.length === 0 && !showCreate ? '<div class="combo-empty">No matches</div>' : ""}
    </div>` : ""}
  </div>`;
}
function comboRefresh(id) {
  const el = document.querySelector(`[data-combo-wrap="${id}"]`);
  if (el) el.innerHTML = comboHTML(id);
}
function focusComboInput(id) {
  const inp = document.querySelector(`[data-combo-input="${id}"]`);
  if (inp) { inp.focus({ preventScroll: true }); const v = inp.value; inp.setSelectionRange(v.length, v.length); }
}
document.addEventListener("input", (e) => {
  const inp = e.target.closest("[data-combo-input]");
  if (!inp) return;
  const id = inp.dataset.comboInput;
  comboUi[id].query = inp.value;
  comboUi[id].open = true;
  comboRefresh(id);
  focusComboInput(id);
});
document.addEventListener("focusin", (e) => {
  const inp = e.target.closest("[data-combo-input]");
  if (!inp) return;
  const id = inp.dataset.comboInput;
  if (!comboUi[id].open) {
    comboUi[id].open = true;
    comboRefresh(id);
    focusComboInput(id);
  }
});
document.addEventListener("click", (e) => {
  const opt = e.target.closest("[data-combo-option]");
  if (opt) {
    const id = opt.dataset.comboOption;
    const value = opt.dataset.value;
    const cfg = comboRegistry[id];
    let selected = cfg.getSelected();
    if (cfg.multi) {
      selected = selected.includes(value) ? selected.filter((v) => v !== value) : [...selected, value];
      cfg.setSelected(selected);
      comboUi[id].query = "";
    } else {
      cfg.setSelected([value]);
      comboUi[id].open = false;
      comboUi[id].query = "";
    }
    if (cfg.onChange) cfg.onChange();
    comboRefresh(id);
    return;
  }
  const create = e.target.closest("[data-combo-create]");
  if (create) {
    const id = create.dataset.comboCreate;
    const cfg = comboRegistry[id];
    const newVal = comboUi[id].query.trim();
    if (!newVal) return;
    const finish = () => {
      let selected = cfg.getSelected();
      selected = cfg.multi ? [...selected, newVal] : [newVal];
      cfg.setSelected(selected);
      comboUi[id].query = "";
      comboUi[id].open = !!cfg.multi;
      if (cfg.onChange) cfg.onChange();
      comboRefresh(id);
    };
    if (cfg.onCreate) cfg.onCreate(newVal).then(finish).catch(finish);
    else finish();
    return;
  }
  const remove = e.target.closest("[data-combo-remove]");
  if (remove) {
    const id = remove.dataset.comboRemove;
    const value = remove.dataset.value;
    const cfg = comboRegistry[id];
    cfg.setSelected(cfg.getSelected().filter((v) => v !== value));
    if (cfg.onChange) cfg.onChange();
    comboRefresh(id);
    return;
  }
  if (!e.target.closest(".combo")) {
    let changed = false;
    Object.keys(comboUi).forEach((id) => {
      if (comboUi[id].open) { comboUi[id].open = false; comboUi[id].query = ""; changed = true; }
    });
    if (changed) Object.keys(comboRegistry).forEach((id) => comboRefresh(id));
  }
});

function formatMoney(v) {

async function handleAuthSubmit() {

    authError = "";

    // onAuthStateChange will pick this up and boot the app
  }

// ---- Price range slider (Selling Price) ----
function parsePrice(v) {
  const n = parseFloat(String(v || "").replace(/,/g, ""));
  return isNaN(n) ? null : n;
}
function computePriceBounds() {
  const vals = listings.map((l) => parsePrice(l.selling_price)).filter((n) => n !== null);
  priceDataMin = vals.length ? Math.min(...vals) : 0;
  priceDataMax = vals.length ? Math.max(...vals) : 0;
  if (priceDataMin === priceDataMax) priceDataMax = priceDataMin + 1; // avoid a zero-width slider
  priceMin = priceDataMin;
  priceMax = priceDataMax;
}
function sliderPriceLabel(n) {
  if (n === null || n === undefined || isNaN(n)) return "0";
  return Math.round(n).toLocaleString("en-PH");
}
function renderPriceSlider(isAdmin) {
  const row = $("priceSliderRow");
  if (!row) return;
  const vals = listings.map((l) => parsePrice(l.selling_price)).filter((n) => n !== null);
  if (vals.length === 0) { row.innerHTML = ""; return; }
  row.innerHTML = `
    <div class="price-slider-inner">
      <div class="price-slider-head">
        <span>Selling Price</span>
        <span class="price-range-values">₱${sliderPriceLabel(priceMin)} – ₱${sliderPriceLabel(priceMax)}</span>
        <a href="#" id="priceResetLink" class="price-reset-link">Reset</a>
      </div>
      <div class="range-slider">
        <div class="range-track"></div>
        <div class="range-fill" id="rangeFill"></div>
        <input type="range" id="priceMinRange" min="${priceDataMin}" max="${priceDataMax}" value="${priceMin}" />
        <input type="range" id="priceMaxRange" min="${priceDataMin}" max="${priceDataMax}" value="${priceMax}" />
      </div>
    </div>
  `;
  updateRangeFill();
  const minEl = $("priceMinRange"), maxEl = $("priceMaxRange");
  const onSlide = () => {
    let a = parseFloat(minEl.value), b = parseFloat(maxEl.value);
    if (a > b) { const t = a; a = b; b = t; }
    priceMin = a; priceMax = b;
    row.querySelector(".price-range-values").textContent = `₱${sliderPriceLabel(priceMin)} – ₱${sliderPriceLabel(priceMax)}`;
    updateRangeFill();
    renderListRows(isAdmin);
    logSearchDebounced();
  };
  minEl.addEventListener("input", onSlide);
  maxEl.addEventListener("input", onSlide);
  $("priceResetLink").addEventListener("click", (e) => {
    e.preventDefault();
    priceMin = priceDataMin; priceMax = priceDataMax;
    renderPriceSlider(isAdmin);
    renderListRows(isAdmin);
  });
}
function updateRangeFill() {
  const fill = $("rangeFill");
  if (!fill || priceDataMax === priceDataMin) return;
  const leftPct = ((priceMin - priceDataMin) / (priceDataMax - priceDataMin)) * 100;
  const rightPct = ((priceMax - priceDataMin) / (priceDataMax - priceDataMin)) * 100;
  fill.style.left = leftPct + "%";
  fill.style.width = (rightPct - leftPct) + "%";
}

function getFiltered() {
  const q = $("searchInput") ? $("searchInput").value.trim().toLowerCase() : "";
  return listings.filter((l) => {
    if (filterRegions.length && !filterRegions.includes(regionForMunicipality(l.municipality))) return false;
    if (filterCities.length && !filterCities.includes(l.municipality)) return false;
    if (filterCategories.length && !filterCategories.includes(l.category)) return false;
    if (filterStatuses.length && !filterStatuses.includes(l.status)) return false;
    if (priceMin !== null && priceMax !== null && !(priceMin === priceDataMin && priceMax === priceDataMax)) {
      const p = parsePrice(l.selling_price);
      if (p === null || p < priceMin || p > priceMax) return false;
    }
    if (q) {
      const hay = `${l.property_code||""} ${l.owner_name||""} ${l.address||""} ${l.municipality||""} ${l.barangay||""} ${l.lot_no||""} ${l.title_no||""}`.toLowerCase();
      if (!hay.includes(q)) return false;

    }
    return true;
  });
}

// ---- Search logging (debounced) ----
function logSearchDebounced() {
  clearTimeout(searchLogTimer);
  searchLogTimer = setTimeout(logSearchNow, 800);
}
async function logSearchNow() {
  if (!session) return;
  const locationLabel = [...filterRegions, ...filterCities].join(", ") || "All";
  const categoryLabelStr = filterCategoryLabels().join(", ") || "All";
  const statusLabelStr = filterStatuses.join(", ") || "All";
  const priceActive = priceMin !== null && priceMax !== null && !(priceMin === priceDataMin && priceMax === priceDataMax);
  const q = $("searchInput") ? $("searchInput").value.trim() : "";
  if (!q && filterRegions.length === 0 && filterCities.length === 0 && filterCategories.length === 0 && filterStatuses.length === 0 && !priceActive) return; // skip logging empty/default state
  const resultsCount = getFiltered().length;
  try {
    await sb.from("search_logs").insert({
      user_id: session.user.id,
      query_text: q,
      filter_location: locationLabel,
      filter_category: categoryLabelStr,
      filter_status: priceActive ? `${statusLabelStr} | Price ${Math.round(priceMin)}-${Math.round(priceMax)}` : statusLabelStr,
      results_count: resultsCount,
    });
  } catch (e) { console.error("search log failed", e); }
}

        <div><label>Status</label><select class="field" id="f_status" style="width:100%"></select></div>
      </div>
      <div class="section-title">Documents</div>
      <div class="row3">
        <div><label>Lot No.</label><input id="f_lot_no" /></div>
        <div><label>Title No.</label><input id="f_title_no" /></div>
        <div><label>Tax Dec No.</label><input id="f_tax_dec_no" /></div>
      </div>
      <div class="section-title">Area & Pricing</div>
      <div class="row3">
        <div><label>Lot Area (sqm)</label><input id="f_lot_area" /></div>
        <div><label>ATS Price (₱)</label><input id="f_ats_price" /></div>
        <div><label>Selling Price (₱)</label><input id="f_selling_price" /></div>
      </div>
      <div class="section-title">Agent Hierarchy</div>
      <div style="font-size:11.5px; color:#6B6558; margin-bottom:6px;">Search and pick an existing name, or type a new one and choose "+ Add" — new names are saved to the shared directory automatically.</div>
      <div class="row2">
        ${AGENT_ROLE_FIELDS.slice(0, 2).map((f) => `<div><label>${f.label}</label><div data-combo-wrap="modal_${f.id}"></div></div>`).join("")}
      </div>
      <div class="row3">
        ${AGENT_ROLE_FIELDS.slice(2).map((f) => `<div><label>${f.label}</label><div data-combo-wrap="modal_${f.id}"></div></div>`).join("")}
      </div>
      <div class="section-title">Photo Link & Remarks</div>
      <label>Photo Link — Google Drive (one per line)</label>
      <textarea id="f_photo_urls" placeholder="https://drive.google.com/file/d/.../view?usp=sharing"></textarea>
      <div style="font-size:11.5px; color:#6B6558; margin-top:2px;">Set each file's sharing to "Anyone with the link" in Google Drive, or agents won't be able to view it.</div>
      <label>Remarks</label><textarea id="f_remarks"></textarea>
      <div class="modal-actions">
        <button type="button" class="btn secondary" id="cancelFormModal">Cancel</button>
        <button type="submit" class="btn">${submitLabel}</button>
      </div>
    </form>`;
  document.body.appendChild(backdrop);

  const populateSelect = (el, options) => { el.innerHTML = options.map((o) => typeof o === "string" ? `<option value="${o}">${o}</option>` : `<option value="${o.id}">${o.label}</option>`).join(""); };
  populateSelect(backdrop.querySelector("#f_category"), CATEGORIES);
  populateSelect(backdrop.querySelector("#f_status"), STATUSES);
  backdrop.querySelector("#f_category").value = values.category || "raw_land";
  backdrop.querySelector("#f_status").value = values.status || "Available";
  FIELD_IDS.filter((id) => id !== "category" && id !== "status").forEach((id) => {
    backdrop.querySelector("#f_" + id).value = values[id] || "";
  });

  registerCombo("modal_region", {
    options: () => PH_REGIONS,
    getSelected: () => [formValues.region],
    setSelected: (arr) => {
      formValues.region = arr[0] || "Region VII – Central Visayas";
      const available = REGION_CITY_MAP[formValues.region] || [];
      if (!available.includes(formValues.municipality)) formValues.municipality = available[0] || "";
      comboRefresh("modal_municipality");
    },
    multi: false,
    allowCreate: false,
    placeholder: "Search region...",
  });
  registerCombo("modal_municipality", {
    options: () => REGION_CITY_MAP[formValues.region] || [],
    getSelected: () => (formValues.municipality ? [formValues.municipality] : []),
    setSelected: (arr) => { formValues.municipality = arr[0] || ""; },
    multi: false,
    allowCreate: false,
    placeholder: (REGION_CITY_MAP[formValues.region] || []).length ? "Search municipality/city..." : "No cities added for this region yet",
  });
  comboRefresh("modal_region");
  comboRefresh("modal_municipality");

  AGENT_ROLE_FIELDS.forEach((f) => {
    registerCombo("modal_" + f.id, {
      options: () => agentNames,
      getSelected: () => (formValues[f.id] ? [formValues[f.id]] : []),
      setSelected: (arr) => { formValues[f.id] = arr[0] || ""; },
      multi: false,
      allowCreate: true,
      onCreate: (name) => createAgentName(name),
      placeholder: `Search or add ${f.label.toLowerCase()}...`,
    });
    comboRefresh("modal_" + f.id);
  });

  const close = () => backdrop.remove();
  backdrop.querySelector("#closeFormModal").addEventListener("click", close);
  backdrop.querySelector("#cancelFormModal").addEventListener("click", close);
  backdrop.addEventListener("click", (e) => { if (e.target === backdrop) close(); });
  backdrop.querySelector("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const payload = {};
    FIELD_IDS.forEach((id) => { payload[id] = backdrop.querySelector("#f_" + id).value.trim(); });
    payload.municipality = formValues.municipality;
    AGENT_ROLE_FIELDS.forEach((f) => { payload[f.id] = formValues[f.id] || ""; });
    if (!payload.property_code || !payload.owner_name) return;
    const badPhotos = photoList(payload.photo_urls).filter((u) => !isDriveLink(u));
    if (badPhotos.length > 0) {
      alert("Photo links must be Google Drive links (drive.google.com). Please fix or remove:\n\n" + badPhotos.join("\n"));
      return;
    }
    if (editingId) await updateListing(editingId, payload);
    else await createListing(payload);
    close();
  });
}

async function createListing(payload) {
  const { error } = await sb.from("listings").insert(payload);
  if (error) { showError("Could not save: " + error.message); return; }
  await loadListings(true);
}
async function updateListing(id, payload) {
  const { error } = await sb.from("listings").update({ ...payload, updated_at: new Date().toISOString() }).eq("id", id);
  if (error) { showError("Could not save: " + error.message); return; }
  await loadListings(true);
}
async function archiveListing(id) {
  if (!confirm("Archive this listing? It will be hidden from the main list, and can be restored or permanently deleted from the Archive tab.")) return;
  const { error } = await sb.from("listings").update({ archived: true, updated_at: new Date().toISOString() }).eq("id", id);
  if (error) { showError("Could not archive: " + error.message); return; }
  await loadListings(true);
}

function exportCSV() {
  const rows = getFiltered().map((l) => ({
    propertyCode: l.property_code, registrationDate: l.registration_date, ownerName: l.owner_name,
    contactNo: l.contact_no, address: l.address, municipality: l.municipality, barangay: l.barangay,
    category: categoryLabel(l.category), status: l.status,
    lotNo: l.lot_no, titleNo: l.title_no, taxDecNo: l.tax_dec_no, lotArea: l.lot_area,
    atsPrice: l.ats_price, sellingPrice: l.selling_price,
    siteLocator: l.site_locator, recruitedBy: l.recruited_by, unitManager: l.unit_manager,
    divisionManager: l.division_manager, subBroker: l.sub_broker,
    remarks: l.remarks || "", "Photo Link": l.photo_urls || "",
  }));
  const csv = Papa.unparse(rows);
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `mrbestbuy-listings-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

function handleImportFile(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  Papa.parse(file, {
    header: true, skipEmptyLines: true,
    complete: async (results) => {
      const rows = results.data.map((row) => {
        const rawCat = (row.category || row.Category || "raw_land").toString().toLowerCase();
        let category = "raw_land";
        if (rawCat.includes("house")) category = "house_and_lot";
        else if (rawCat.includes("commercial")) category = "commercial_lot";
        else if (rawCat.includes("industrial")) category = "industrial_lot";
        const rawStatus = row.status || row.Status || "Available";
        const rawLoc = row.municipality || row.Municipality || row.location || "Cebu City";
        return {
          property_code: (row.propertyCode || row["Property Code"] || "").toString().trim(),
          registration_date: (row.registrationDate || row["Registration Date"] || "").toString().trim() || null,
          owner_name: (row.ownerName || row["Owner's Name"] || "").toString().trim(),
          contact_no: (row.contactNo || row["Contact No"] || "").toString().trim(),
          address: (row.address || row.Address || "").toString().trim(),
          municipality: CEBU_LOCATIONS.includes(rawLoc) ? rawLoc : "Cebu City",
          barangay: (row.barangay || row.Barangay || "").toString().trim(),
          category,
          status: STATUSES.includes(rawStatus) ? rawStatus : "Available",
          lot_no: (row.lotNo || row["Lot No"] || "").toString().trim(),
          title_no: (row.titleNo || row["Title No"] || "").toString().trim(),
          tax_dec_no: (row.taxDecNo || row["Tax Dec No"] || "").toString().trim(),
          lot_area: (row.lotArea || row["Lot Area"] || "").toString().trim(),
          ats_price: (row.atsPrice || row["ATS Price"] || "").toString().trim(),
          selling_price: (row.sellingPrice || row["Selling Price"] || "").toString().trim(),
          site_locator: (row.siteLocator || row["Site Locator"] || "").toString().trim(),
          recruited_by: (row.recruitedBy || row["Recruited By"] || "").toString().trim(),
          unit_manager: (row.unitManager || row["Unit Manager"] || "").toString().trim(),
          division_manager: (row.divisionManager || row["Division Manager"] || "").toString().trim(),
          sub_broker: (row.subBroker || row["Sub Broker"] || "").toString().trim(),
          remarks: (row.remarks || row.Remarks || "").toString().trim(),
          photo_urls: (row.photoUrls || row["Photo URLs"] || row["Photo Link"] || row["Photo Links"] || "").toString().trim(),
        };
      }).filter((r) => r.property_code || r.owner_name);
      if (rows.length === 0) { alert('No valid rows found. Make sure the CSV has "propertyCode" or "ownerName" columns.'); return; }
      const nonDriveCount = rows.filter((r) => photoList(r.photo_urls).some((u) => !isDriveLink(u))).length;
      const photoWarning = nonDriveCount > 0
        ? `\n\nNote: ${nonDriveCount} row(s) have photo links that aren't Google Drive links — they'll be saved as-is but may not display correctly.`
        : "";
      if (confirm(`Import ${rows.length} listing(s)?${photoWarning}`)) {
        const { error } = await sb.from("listings").insert(rows);
        if (error) { showError("Import failed: " + error.message); return; }
        // Register any new agent names from this batch into the shared directory
        const newNames = new Set();
        rows.forEach((r) => {
          ["site_locator", "recruited_by", "unit_manager", "division_manager", "sub_broker"].forEach((k) => {
            if (r[k] && !agentNames.includes(r[k])) newNames.add(r[k]);
          });
        });
        for (const name of newNames) await createAgentName(name);
        await loadListings(true);
      }
    },
    error: () => alert("Could not read that file. Please check it is a valid CSV."),
  });
  e.target.value = "";
}

async function renderArchiveView() {
  const body = $("tabBody");
  body.innerHTML = `<div class="panel"><div id="archiveList">Loading…</div></div>`;
  const { data, error } = await sb.from("listings").select("*").eq("archived", true).order("updated_at", { ascending: false });
  if (error) { $("archiveList").innerHTML = `<div class="errline">Could not load: ${escapeHtml(error.message)}</div>`; return; }
  const items = data || [];
  const list = $("archiveList");
  if (items.length === 0) {
    list.innerHTML = `<div class="empty"><h3>Archive is empty</h3><p>Listings you archive from the main list will show up here, where you can restore them or delete them for good.</p></div>`;
    return;
  }
  list.innerHTML = items.map((l) => `
    <div class="card">
      <div class="card-row">
        <div>
          <div style="font-family:Georgia,serif; font-size:15px; color:#163832;">${escapeHtml(l.property_code || "No code")} — ${escapeHtml(l.owner_name)}</div>
          <div style="font-size:12.5px; color:#6B6558;">${escapeHtml(l.municipality)}${l.barangay ? ", " + escapeHtml(l.barangay) : ""} · ${categoryLabel(l.category)} · ${l.status}</div>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn secondary" data-restore="${l.id}">Restore</button>
          <button class="btn danger" data-permadelete="${l.id}">Delete permanently</button>
        </div>
      </div>
    </div>`).join("");
  list.querySelectorAll("[data-restore]").forEach((btn) => btn.addEventListener("click", () => restoreListing(btn.dataset.restore)));
  list.querySelectorAll("[data-permadelete]").forEach((btn) => btn.addEventListener("click", () => permanentlyDeleteListing(btn.dataset.permadelete)));
}
async function restoreListing(id) {
  const { error } = await sb.from("listings").update({ archived: false, updated_at: new Date().toISOString() }).eq("id", id);
  if (error) { alert("Could not restore: " + error.message); return; }
  renderArchiveView();
}
async function permanentlyDeleteListing(id) {
  if (!confirm("Permanently delete this listing? This cannot be undone — it will not be recoverable from Archive.")) return;
  const { error } = await sb.from("listings").delete().eq("id", id);
  if (error) { alert("Could not delete: " + error.message); return; }
  renderArchiveView();
}

async function renderAgentDirectoryView() {
  const body = $("tabBody");
  body.innerHTML = `
    <div class="panel">
      <div class="card">
        <div style="font-family:Georgia,serif; color:#163832; font-size:15px; margin-bottom:10px;">Add a name</div>
        <div style="display:flex; gap:8px;">
          <input id="newAgentNameInput" placeholder="Full name" style="flex:1; border:1px solid #E4DDCF; border-radius:3px; padding:8px 10px; font-size:14px;" />
          <button class="btn" id="addAgentNameBtn">+ Add</button>
        </div>
        <div class="errline" id="agentDirError" style="display:none;"></div>
      </div>
      <div id="agentDirectoryList">Loading…</div>
    </div>
  `;
  $("addAgentNameBtn").addEventListener("click", async () => {
    const input = $("newAgentNameInput");
    const name = input.value.trim();
    const errEl = $("agentDirError");
    errEl.style.display = "none";
    if (!name) return;
    if (agentNames.includes(name)) { errEl.textContent = "That name is already in the directory."; errEl.style.display = "block"; return; }
    await createAgentName(name);
    input.value = "";
    renderAgentDirectoryView();
  });

  const { data, error } = await sb.from("agent_directory").select("*").order("name");
  if (error) { $("agentDirectoryList").innerHTML = `<div class="errline">Could not load: ${escapeHtml(error.message)}</div>`; return; }
  agentNames = (data || []).map((r) => r.name);
  const list = $("agentDirectoryList");
  if (!data || data.length === 0) {
    list.innerHTML = `<div class="empty"><h3>No names yet</h3><p>Add names above, or they'll be added automatically the first time you use them on a listing.</p></div>`;
    return;
  }
  list.innerHTML = data.map((row) => `
    <div class="card">
      <div class="card-row">
        <div id="agentRow_${row.id}" style="font-family:Georgia,serif; font-size:15px; color:#163832;">${escapeHtml(row.name)}</div>
        <div style="display:flex; gap:8px;">
          <button class="btn secondary" data-rename="${row.id}" data-name="${escapeHtml(row.name)}">Rename</button>
          <button class="btn danger" data-deleteagent="${row.id}" data-name="${escapeHtml(row.name)}">Delete</button>
        </div>
      </div>
    </div>`).join("");
  list.querySelectorAll("[data-rename]").forEach((btn) => btn.addEventListener("click", () => renameAgentName(btn.dataset.rename, btn.dataset.name)));
  list.querySelectorAll("[data-deleteagent]").forEach((btn) => btn.addEventListener("click", () => deleteAgentName(btn.dataset.deleteagent, btn.dataset.name)));
}
async function renameAgentName(id, oldName) {
  const newName = prompt("Rename this agent/personnel:", oldName);
  if (!newName || !newName.trim() || newName.trim() === oldName) return;
  const { error } = await sb.from("agent_directory").update({ name: newName.trim() }).eq("id", id);
  if (error) { alert("Could not rename: " + error.message); return; }
  alert('Note: existing listings that already used "' + oldName + '" keep that text as-is — this only changes the name for future selections. Edit those listings individually if you want them updated too.');
  renderAgentDirectoryView();
}
async function deleteAgentName(id, name) {
  if (!confirm(`Remove "${name}" from the directory? Existing listings that used this name keep it as plain text — this only stops it appearing as a suggestion going forward.`)) return;
  const { error } = await sb.from("agent_directory").delete().eq("id", id);
  if (error) { alert("Could not delete: " + error.message); return; }
  renderAgentDirectoryView();
}

async function renderReportsView() {
  const body = $("tabBody");
  body.innerHTML = `<div class="panel"><div id="reportsBody">Loading…</div></div>`;

  const [{ data: logs, error: logErr }, { data: allProfiles, error: profErr }] = await Promise.all([
    sb.from("search_logs").select("*").order("searched_at", { ascending: false }).limit(500),
    sb.from("profiles").select("id, email, full_name"),
  ]);
  if (logErr) { $("reportsBody").innerHTML = `<div class="errline">Could not load logs: ${escapeHtml(logErr.message)}</div>`; return; }

  searchLogs = logs || [];
  profilesById = {};
  (allProfiles || []).forEach((p) => { profilesById[p.id] = p; });

  if (searchLogs.length === 0) {
    $("reportsBody").innerHTML = `<div class="empty"><h3>No search activity yet</h3><p>Once agents start searching and filtering, activity will show up here.</p></div>`;
    return;
  }

  const countByCommaField = (field) => {
    const m = {};
    searchLogs.forEach((l) => {
      (l[field] || "").split(",").map((s) => s.trim()).filter((s) => s && s !== "All").forEach((tok) => { m[tok] = (m[tok] || 0) + 1; });
    });
    return Object.entries(m).sort((a, b) => b[1] - a[1]).slice(0, 5);
  };
  const topLocations = countByCommaField("filter_location");
  const topCategories = countByCommaField("filter_category");
  const byUser = {};
  searchLogs.forEach((l) => { byUser[l.user_id] = (byUser[l.user_id] || 0) + 1; });
  const topUsers = Object.entries(byUser).sort((a, b) => b[1] - a[1]).slice(0, 5);

  const nameFor = (id) => { const p = profilesById[id]; return p ? (p.full_name || p.email) : "(unknown)"; };

  const statCardsHtml = (title, rows, empty) => `
    <div class="stat-card">
      <div class="lbl">${title}</div>
      ${rows.length === 0 ? `<div style="font-size:12.5px;color:#6B6558;margin-top:8px;">${empty}</div>` :
        rows.map(([k, v]) => `<div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;"><span>${escapeHtml(k)}</span><b style="color:#163832;">${v}</b></div>`).join("")}
    </div>`;

  $("reportsBody").innerHTML = `
    <div class="stat-cards">
      ${statCardsHtml("Top Searched Locations", topLocations, "No location filters used yet")}
      ${statCardsHtml("Top Searched Categories", topCategories, "No category filters used yet")}
      ${statCardsHtml("Most Active Agents", topUsers.map(([id, c]) => [nameFor(id), c]), "No activity yet")}
    </div>
    <div class="card">
      <div style="font-family:Georgia,serif; color:#163832; font-size:15px; margin-bottom:10px;">Recent Search Activity (last 500)</div>
      <div style="overflow-x:auto;">
        <table class="logtable">
          <thead><tr><th>When</th><th>Agent</th><th>Query</th><th>Location</th><th>Category</th><th>Status</th><th>Results</th></tr></thead>
          <tbody>
            ${searchLogs.slice(0, 200).map((l) => `
              <tr>
                <td>${new Date(l.searched_at).toLocaleString()}</td>
                <td>${escapeHtml(nameFor(l.user_id))}</td>
                <td>${escapeHtml(l.query_text) || "—"}</td>
                <td>${escapeHtml(l.filter_location)}</td>
                <td>${l.filter_category ? escapeHtml(categoryLabel(l.filter_category)) : "All"}</td>
                <td>${escapeHtml(l.filter_status)}</td>
                <td>${l.results_count}</td>
              </tr>`).join("")}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

// =====================================================================
// BOOT / AUTH STATE
// =====================================================================
async function boot() {
  const { data: { session: s } } = await sb.auth.getSession();
  session = s;
  if (!session) { renderAuth(); return; }
  await loadProfileAndRender();
}

async function loadProfileAndRender() {
  const { data, error } = await sb.from("profiles").select("*").eq("id", session.user.id).single();
  if (error || !data) {
    // profile row not created yet (trigger race) — brief retry
    setTimeout(loadProfileAndRender, 800);
    return;
  }
  profile = data;
  if (profile.status !== "approved") renderPending();
  else renderApp();
}

sb.auth.onAuthStateChange((event, s) => {
  session = s;
  if (!session) { profile = null; renderAuth(); return; }
  loadProfileAndRender();
});

if (SUPABASE_URL.includes("PASTE_YOUR") || SUPABASE_ANON_KEY.includes("PASTE_YOUR")) {
  $("root").innerHTML = `<div class="auth-wrap"><h1>Setup needed</h1><p style="font-size:13px;color:#6B6558;">Open this file and paste your Supabase URL and anon key at the top before using.</p></div>`;
} else {
  boot();
}
