  const SUPABASE_ANON_KEY = "sb_publishable_SnacWlVeRCN6OOg-dYsAxw_2Q2lfX6m";
  // =====================================================================

  const CEBU_LOCATIONS = [
    "Alcantara","Alcoy","Alegria","Aloguinsan","Argao","Asturias","Badian","Balamban",
    "Bantayan","Barili","Bogo City","Boljoon","Borbon","Carcar City","Carmen","Catmon",

    "Sibonga","Sogod","Tabogon","Tabuelan","Talisay City","Toledo City","Tuburan","Tudela",
  ];
  const BOHOL_LOCATIONS = [
    "Alburquerque","Alicia","Anda","Antequera","Baclayon","Balilihan","Batuan","Bien Unido",
    "Bilar","Buenavista","Calape","Candijay","Carmen","Catigbian","Clarin","Corella","Cortes",
    "Dagohoy","Danao","Dauis","Dimiao","Duero","Garcia Hernandez","Getafe","Guindulman",
    "Inabanga","Jagna","Lila","Loay","Loboc","Loon","Mabini","Maribojoc","Panglao","Pilar",
    "President Carlos P. Garcia","Sagbayan","San Isidro","San Miguel","Sevilla",
    "Sierra Bullones","Sikatuna","Tagbilaran City","Talibon","Trinidad","Tubigon","Ubay","Valencia",
  ];
  const NCR_LOCATIONS = [
    "Caloocan City","Las Piñas City","Makati City","Malabon City","Mandaluyong City",
    "Manila City","Marikina City","Muntinlupa City","Navotas City","Parañaque City",
    "Pasay City","Pasig City","Pateros","Quezon City","San Juan City","Taguig City","Valenzuela City",
  ];
  // Real, current official Philippine administrative regions (18, incl. the
  // Negros Island Region re-established in June 2024, which is why Central
  // Visayas here is Cebu + Bohol only — Negros Oriental & Siquijor moved to NIR).
  const PH_REGIONS = [
    "NCR – National Capital Region",
    "CAR – Cordillera Administrative Region",
    "Region I – Ilocos Region",
    "Region II – Cagayan Valley",
    "Region III – Central Luzon",
    "Region IV-A – CALABARZON",
    "MIMAROPA – Region IV-B",
    "Region V – Bicol Region",
    "Region VI – Western Visayas",
    "Region VII – Central Visayas",
    "Region VIII – Eastern Visayas",
    "Negros Island Region",
    "Region IX – Zamboanga Peninsula",
    "Region X – Northern Mindanao",
    "Region XI – Davao Region",
    "Region XII – SOCCSKSARGEN",
    "Region XIII – Caraga",
    "BARMM – Bangsamoro Autonomous Region in Muslim Mindanao",
  ];
  // Real hierarchy: Region -> Province -> City/Municipality.
  // NCR is the one genuine exception in Philippine administrative structure —
  // it has NO provinces; its 17 LGUs sit directly under the region. Every
  // other region here uses { provinces: {...} }; only Region VII (Cebu +
  // Bohol) is populated so far, matching your current business coverage.
  // Add more provinces/cities as coverage expands — nothing else needs to change.
  const REGION_DATA = {};
  PH_REGIONS.forEach((r) => { REGION_DATA[r] = { provinces: {} }; });
  REGION_DATA["NCR – National Capital Region"] = { cities: NCR_LOCATIONS }; // no provinces
  REGION_DATA["Region VII – Central Visayas"] = { provinces: { "Cebu": CEBU_LOCATIONS, "Bohol": BOHOL_LOCATIONS } };

  function regionHasProvinces(region) { return !!(REGION_DATA[region] && REGION_DATA[region].provinces); }
  function provincesForRegion(region) {
    const r = REGION_DATA[region];
    return r && r.provinces ? Object.keys(r.provinces) : [];
  }
  // Cities for one specific region (+ optional province narrowing).
  function citiesForRegionProvince(region, province) {
    const r = REGION_DATA[region];
    if (!r) return [];
    if (r.cities) return r.cities; // NCR-style: no provinces
    if (province) return r.provinces[province] || [];
    return Object.values(r.provinces).flat();
  }
  function regionForMunicipality(m) {
    for (const region of PH_REGIONS) {
      const r = REGION_DATA[region];
      if (r.cities && r.cities.includes(m)) return region;
      if (r.provinces) { for (const list of Object.values(r.provinces)) if (list.includes(m)) return region; }
    }
    return "Other";
  }
  function provinceForMunicipality(m) {
    for (const region of PH_REGIONS) {
      const r = REGION_DATA[region];
      if (!r.provinces) continue;
      for (const [prov, list] of Object.entries(r.provinces)) if (list.includes(m)) return prov;
    }
    return null;
  }
  // Cities available given the CURRENT filter selections (regions + provinces).
  function citiesForRegions(regionsArr, provincesArr) {
    const hasProvinceFilter = provincesArr && provincesArr.length > 0;
    let regions;
    if (regionsArr && regionsArr.length) {
      regions = regionsArr;
    } else if (hasProvinceFilter) {
      // No region explicitly chosen, but a province was — only consider
      // regions that actually contain that province (fixes NCR's cities
      // leaking in whenever a province like "Cebu" was picked with no
      // region selected: NCR has no provinces, so it must be excluded here).
      regions = PH_REGIONS.filter((region) => {
        const r = REGION_DATA[region];
        return r && r.provinces && provincesArr.some((p) => Object.prototype.hasOwnProperty.call(r.provinces, p));
      });
    } else {
      regions = PH_REGIONS;
    }
    let pool = [];
    regions.forEach((region) => {
      const r = REGION_DATA[region];
      if (!r) return;
      if (r.cities) {
        // No-province region (NCR): only include it when no province filter
        // is active at all — a province filter can never match it.
        if (!hasProvinceFilter) pool.push(...r.cities);
        return;
      }
      const provNames = Object.keys(r.provinces);
      const relevant = hasProvinceFilter ? provincesArr.filter((p) => provNames.includes(p)) : provNames;
      relevant.forEach((p) => pool.push(...r.provinces[p]));
    });
    return [...new Set(pool)];
  }
  // Province options available given the current region selection.
  function provincesForRegions(regionsArr) {
    const regions = (regionsArr && regionsArr.length) ? regionsArr : PH_REGIONS;
    let pool = [];
    regions.forEach((region) => {
      const r = REGION_DATA[region];
      if (r && r.provinces) pool.push(...Object.keys(r.provinces));
    });
    return [...new Set(pool)];
  }
  // Which region(s) a given province actually belongs to — used so picking
  // a province in the filter toolbar auto-selects its parent region too.
  function regionsForProvince(province) {
    return PH_REGIONS.filter((region) => {
      const r = REGION_DATA[region];
      return r && r.provinces && Object.prototype.hasOwnProperty.call(r.provinces, province);
    });
  }

    { id: "raw_land", label: "Raw Land" },
    { id: "house_and_lot", label: "House and Lot" },
    { id: "commercial_lot", label: "Commercial Lot" },
    { id: "industrial_lot", label: "Industrial Lot" },
  ];
  const STATUSES = ["Available", "Reserved", "Sold"];

function driveFileId(url) {
  if (!url) return null;
  let m = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);       // .../file/d/FILE_ID/view
  if (m) return m[1];
  m = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);                 // ...?id=FILE_ID or open?id=FILE_ID
  if (m) return m[1];
  return null;
}
function driveImageSrc(url) {
  const id = driveFileId(url);
  return id ? `https://lh3.googleusercontent.com/d/${id}` : url; // falls back to raw url if not recognized
}
function isDriveLink(url) { return /drive\.google\.com/i.test(url || ""); }

// =====================================================================
// COMBOBOX ENGINE — reusable search + dropdown + multi-select + create
// =====================================================================
const comboRegistry = {}; // id -> { options(): string[], getSelected(): string[], setSelected(arr), multi, allowCreate, onCreate?(name), onChange?(), placeholder }
const comboUi = {};       // id -> { query: string, open: boolean }

function registerCombo(id, config) {
  comboRegistry[id] = config;
  if (!comboUi[id]) comboUi[id] = { query: "", open: false };
}
function comboFilteredOptions(id) {
  const cfg = comboRegistry[id];
  const opts = cfg.options();
  const q = comboUi[id].query.trim().toLowerCase();
  return q ? opts.filter((o) => o.toLowerCase().includes(q)) : opts;
}
function comboHTML(id) {
  const cfg = comboRegistry[id];
  const ui = comboUi[id];
  const selected = cfg.getSelected();
  const filtered = comboFilteredOptions(id);
  const queryTrim = ui.query.trim();
  const exactMatch = cfg.options().some((o) => o.toLowerCase() === queryTrim.toLowerCase());
  const showCreate = cfg.allowCreate && queryTrim && !exactMatch;
  const inputValue = cfg.multi ? ui.query : (ui.open ? ui.query : (selected[0] || ""));
  const chips = cfg.multi && selected.length
    ? `<div class="combo-chips">${selected.map((v) => `<span class="combo-chip">${escapeHtml(v)}<button type="button" data-combo-remove="${id}" data-value="${escapeHtml(v)}">&times;</button></span>`).join("")}</div>`
    : "";
  return `<div class="combo">
    ${chips}
    <input class="combo-input" data-combo-input="${id}" placeholder="${escapeHtml(cfg.placeholder || "Search...")}" value="${escapeHtml(inputValue)}" autocomplete="off" />
    ${ui.open ? `<div class="combo-dropdown">
      ${filtered.map((o) => `<div class="combo-option${selected.includes(o) ? " selected" : ""}" data-combo-option="${id}" data-value="${escapeHtml(o)}">${cfg.multi ? (selected.includes(o) ? "☑ " : "☐ ") : ""}${escapeHtml(o)}</div>`).join("")}
      ${showCreate ? `<div class="combo-option combo-create" data-combo-create="${id}">+ Add "${escapeHtml(queryTrim)}"</div>` : ""}
      ${filtered.length === 0 && !showCreate ? '<div class="combo-empty">No matches</div>' : ""}
    </div>` : ""}
  </div>`;
}
function comboRefresh(id) {
  const el = document.querySelector(`[data-combo-wrap="${id}"]`);
  if (el) el.innerHTML = comboHTML(id);
}
function focusComboInput(id) {
  const inp = document.querySelector(`[data-combo-input="${id}"]`);
  if (inp) { inp.focus({ preventScroll: true }); const v = inp.value; inp.setSelectionRange(v.length, v.length); }
}
document.addEventListener("input", (e) => {
  const inp = e.target.closest("[data-combo-input]");
  if (!inp) return;
  const id = inp.dataset.comboInput;
  comboUi[id].query = inp.value;
  comboUi[id].open = true;
  comboRefresh(id);
  focusComboInput(id);
});
document.addEventListener("focusin", (e) => {
  const inp = e.target.closest("[data-combo-input]");
  if (!inp) return;
  const id = inp.dataset.comboInput;
  if (!comboUi[id].open) {
    comboUi[id].open = true;
    comboRefresh(id);
    focusComboInput(id);
  }
});
document.addEventListener("click", (e) => {
  const opt = e.target.closest("[data-combo-option]");
  if (opt) {
    const id = opt.dataset.comboOption;
    const value = opt.dataset.value;
    const cfg = comboRegistry[id];
    let selected = cfg.getSelected();
    if (cfg.multi) {
      selected = selected.includes(value) ? selected.filter((v) => v !== value) : [...selected, value];
      cfg.setSelected(selected);
      comboUi[id].query = "";
    } else {
      cfg.setSelected([value]);
      comboUi[id].open = false;
      comboUi[id].query = "";
    }
    if (cfg.onChange) cfg.onChange();
    comboRefresh(id);
    return;
  }
  const create = e.target.closest("[data-combo-create]");
  if (create) {
    const id = create.dataset.comboCreate;
    const cfg = comboRegistry[id];
    const newVal = comboUi[id].query.trim();
    if (!newVal) return;
    const finish = () => {
      let selected = cfg.getSelected();
      selected = cfg.multi ? [...selected, newVal] : [newVal];
      cfg.setSelected(selected);
      comboUi[id].query = "";
      comboUi[id].open = !!cfg.multi;
      if (cfg.onChange) cfg.onChange();
      comboRefresh(id);
    };
    if (cfg.onCreate) cfg.onCreate(newVal).then(finish).catch(finish);
    else finish();
    return;
  }
  const remove = e.target.closest("[data-combo-remove]");
  if (remove) {
    const id = remove.dataset.comboRemove;
    const value = remove.dataset.value;
    const cfg = comboRegistry[id];
    cfg.setSelected(cfg.getSelected().filter((v) => v !== value));
    if (cfg.onChange) cfg.onChange();
    comboRefresh(id);
    return;
  }
  if (!e.target.closest(".combo")) {
    let changed = false;
    Object.keys(comboUi).forEach((id) => {
      if (comboUi[id].open) { comboUi[id].open = false; comboUi[id].query = ""; changed = true; }
    });
    if (changed) Object.keys(comboRegistry).forEach((id) => comboRefresh(id));
  }
});
async function loadAgentNames() {
  try {
    const { data, error } = await sb.from("agent_directory").select("id, name, type, contact_no, email").order("name");
    if (!error && data) {
      agentDirectory = data;
      agentNames = data.map((r) => r.name);
    }
  } catch (e) { console.error("could not load agent directory", e); }
}
async function createAgentEntry({ name, type, contact_no = "", email = "" }) {
  agentNames = [...new Set([...agentNames, name])].sort();
  agentDirectory = [...agentDirectory, { name, type, contact_no, email }];
  try {
    await sb.from("agent_directory").insert({ name, type, contact_no, email });
  } catch (e) { console.error("could not save new agent entry", e); }
}

function formatMoney(v) {
  if (!v) return null;
  const num = parseFloat(String(v).replace(/,/g, ""));
  if (isNaN(num)) return escapeHtml(v); // fallback: show as-typed if it's not a clean number
  return num.toLocaleString("en-PH");
}

  const toLogin = $("toLogin"); if (toLogin) toLogin.addEventListener("click", () => { authMode = "login"; authError = ""; authMsg = ""; renderAuth(); });

  if (forgotPw) forgotPw.addEventListener("click", async (e) => {
    e.preventDefault();
    const email = $("a_email").value.trim();
    authError = ""; authMsg = "";
    if (!email) { authError = "Enter your email above first, then click \"Forgot password?\" again."; renderAuth(); return; }
    const { error } = await sb.auth.resetPasswordForEmail(email);
    if (error) { authError = error.message; renderAuth(); return; }
    authMsg = "If that email has an account, a password reset link has been sent.";
    renderAuth();
  });
}

async function handleAuthSubmit() {
  const email = $("a_email").value.trim();
  const password = $("a_password").value;
  authError = ""; authMsg = "";
  if (!email || !password) { authError = "Email and password are required."; renderAuth(); return; }
  if (authMode === "signup") {
    const fullName = $("a_name").value.trim();
    const { error } = await sb.auth.signUp({ email, password, options: { data: { full_name: fullName } } });
    if (error) { authError = error.message; renderAuth(); return; }
    authError = "";
    alert("Account created. If email confirmation is required you'll get an email first — either way, an admin still needs to approve your account before you can view listings.");
    authMode = "login";
    renderAuth();
  } else {
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { authError = error.message; renderAuth(); return; }
    // onAuthStateChange will pick this up and boot the app
  }
}

async function signOut() {
  await sb.auth.signOut();
  profile = null;
  session = null;
  authMode = "login";
  renderAuth();
}

// ---- Price range slider (Selling Price) ----
function parsePrice(v) {
  const n = parseFloat(String(v || "").replace(/,/g, ""));
  return isNaN(n) ? null : n;
}
async function computePriceBounds() {
  try {
    const [minRes, maxRes] = await Promise.all([
      sb.from("listings").select("selling_price_num").eq("archived", false).not("selling_price_num", "is", null).order("selling_price_num", { ascending: true }).limit(1),
      sb.from("listings").select("selling_price_num").eq("archived", false).not("selling_price_num", "is", null).order("selling_price_num", { ascending: false }).limit(1),
    ]);
    if (minRes.data && minRes.data[0] && maxRes.data && maxRes.data[0]) {
      priceBoundsFound = true;
      priceDataMin = minRes.data[0].selling_price_num;
      priceDataMax = maxRes.data[0].selling_price_num;
      if (priceDataMax === priceDataMin) priceDataMax = priceDataMin + 1;
    } else {
      priceBoundsFound = false;
      priceDataMin = 0; priceDataMax = 1;
    }
  } catch (e) {
    priceBoundsFound = false;
    priceDataMin = 0; priceDataMax = 1;
  }
  priceMin = priceDataMin;
  priceMax = priceDataMax;
}
function sliderPriceLabel(n) {
  if (n === null || n === undefined || isNaN(n)) return "0";
  return Math.round(n).toLocaleString("en-PH");
}
function renderPriceSlider(isAdmin) {
  const row = $("priceSliderRow");
  if (!row) return;
  if (!priceBoundsFound) { row.innerHTML = ""; return; }
  row.innerHTML = `
    <div class="price-slider-inner">
      <div class="price-slider-head">
        <span>Selling Price</span>
        <span class="price-range-values">₱${sliderPriceLabel(priceMin)} – ₱${sliderPriceLabel(priceMax)}</span>
        <a href="#" id="priceResetLink" class="price-reset-link">Reset</a>
      </div>
      <div class="range-slider">
        <div class="range-track"></div>
        <div class="range-fill" id="rangeFill"></div>
        <input type="range" id="priceMinRange" min="${priceDataMin}" max="${priceDataMax}" value="${priceMin}" />
        <input type="range" id="priceMaxRange" min="${priceDataMin}" max="${priceDataMax}" value="${priceMax}" />
      </div>
    </div>
  `;
  updateRangeFill();
  const minEl = $("priceMinRange"), maxEl = $("priceMaxRange");
  const onSlide = () => {
    let a = parseFloat(minEl.value), b = parseFloat(maxEl.value);
    if (a > b) { const t = a; a = b; b = t; }
    priceMin = a; priceMax = b;
    row.querySelector(".price-range-values").textContent = `₱${sliderPriceLabel(priceMin)} – ₱${sliderPriceLabel(priceMax)}`;
    updateRangeFill();
    clearTimeout(priceSlideTimer);
    priceSlideTimer = setTimeout(() => { currentPage = 0; loadListings(isAdmin); logSearchDebounced(); }, 350);
  };
  minEl.addEventListener("input", onSlide);
  maxEl.addEventListener("input", onSlide);
  $("priceResetLink").addEventListener("click", (e) => {
    e.preventDefault();
    priceMin = priceDataMin; priceMax = priceDataMax;
    renderPriceSlider(isAdmin);
    currentPage = 0;
    loadListings(isAdmin);
  });
}
function updateRangeFill() {
  const fill = $("rangeFill");
  if (!fill || priceDataMax === priceDataMin) return;
  const leftPct = ((priceMin - priceDataMin) / (priceDataMax - priceDataMin)) * 100;
  const rightPct = ((priceMax - priceDataMin) / (priceDataMax - priceDataMin)) * 100;
  fill.style.left = leftPct + "%";
  fill.style.width = (rightPct - leftPct) + "%";
}
function isPriceFilterActive() {
  return priceMin !== null && priceMax !== null && priceBoundsFound && !(priceMin === priceDataMin && priceMax === priceDataMax);
}

// Applies every active filter (region/city, category, status, price, search)
// onto a Supabase query builder. Used by both the paginated list fetch and
// the CSV export, so the two always agree on what "current filters" means.
function applyActiveFilters(query) {
  const cityFilter = filterCities.length ? filterCities : ((filterRegions.length || filterProvinces.length) ? citiesForRegions(filterRegions, filterProvinces) : null);
  if (cityFilter) query = query.in("municipality", cityFilter);
  if (filterCategories.length) query = query.in("category", filterCategories);
  if (filterStatuses.length) query = query.in("status", filterStatuses);
  if (isPriceFilterActive()) query = query.gte("selling_price_num", priceMin).lte("selling_price_num", priceMax);
  const rawQ = $("searchInput") ? $("searchInput").value.trim() : "";
  const term = rawQ.replace(/[,()%]/g, " ").trim();
  if (term) {
    const cols = ["property_code", "owner_name", "address", "municipality", "barangay", "lot_no", "title_no"];
    query = query.or(cols.map((c) => `${c}.ilike.%${term}%`).join(","));
  }
  return query;
}

// Columns needed for the list view itself: row display + search/filter
// matching columns. Everything else (documents, agent hierarchy, remarks,
// photos) is fetched lazily only when a row is expanded or edited — cuts
// payload substantially at scale, on top of pagination doing the heavy lifting.
const LIST_COLUMNS = "id,property_code,owner_name,address,municipality,barangay,lot_no,title_no,lot_area,selling_price,category,status,archived,created_at";

async function loadListings(isAdmin) {
  try {
    let query = sb.from("listings").select(LIST_COLUMNS, { count: "exact" }).eq("archived", false);
    query = applyActiveFilters(query);
    query = query.order("created_at", { ascending: false }).range(currentPage * pageSize, currentPage * pageSize + pageSize - 1);
    const { data, error, count } = await query;
    if (error) throw error;
    listings = data || [];
    totalCount = count || 0;
    showError("");
  } catch (e) {
    showError("Could not load listings: " + e.message);
    console.error(e);
  }
  await loadOverallCounts();
  renderListRows(isAdmin);
  renderPagination(isAdmin);
}

// Whole non-archived inventory counts, independent of current filters —
// count-only queries (head: true), so they cost almost nothing regardless
// of table size.
async function loadOverallCounts() {
  try {
    const base = () => sb.from("listings").select("id", { count: "exact", head: true }).eq("archived", false);
    const [allRes, availRes, resRes, soldRes] = await Promise.all([
      base(), base().eq("status", "Available"), base().eq("status", "Reserved"), base().eq("status", "Sold"),
    ]);
    overallCounts = { all: allRes.count || 0, available: availRes.count || 0, reserved: resRes.count || 0, sold: soldRes.count || 0 };
  } catch (e) { console.error("count query failed", e); }
}

function renderPagination(isAdmin) {
  const row = $("paginationRow");
  if (!row) return;
  if (totalCount === 0) { row.innerHTML = ""; return; }
  const totalPages = Math.max(1, Math.ceil(totalCount / pageSize));
  const startItem = currentPage * pageSize + 1;
  const endItem = Math.min(totalCount, (currentPage + 1) * pageSize);
  row.innerHTML = `
    <div class="pagination-inner">
      <span>Showing ${startItem}–${endItem} of ${totalCount}</span>
      <div class="pagination-controls">
        <label>Per page
          <select id="pageSizeSelect" class="field">
            ${[10, 25, 50, 100].map((n) => `<option value="${n}" ${n === pageSize ? "selected" : ""}>${n}</option>`).join("")}
          </select>
        </label>
        <button class="btn ghost" id="prevPageBtn" ${currentPage <= 0 ? "disabled" : ""}>‹ Prev</button>
        <span class="page-indicator">Page ${currentPage + 1} of ${totalPages}</span>
        <button class="btn ghost" id="nextPageBtn" ${currentPage >= totalPages - 1 ? "disabled" : ""}>Next ›</button>
      </div>
    </div>`;
  $("pageSizeSelect").addEventListener("change", (e) => {
    pageSize = parseInt(e.target.value, 10);
    currentPage = 0;
    loadListings(isAdmin);
  });
  $("prevPageBtn").addEventListener("click", () => { if (currentPage > 0) { currentPage--; loadListings(isAdmin); } });
  $("nextPageBtn").addEventListener("click", () => { if (currentPage < totalPages - 1) { currentPage++; loadListings(isAdmin); } });
}

// Fetches the remaining columns for one listing the first time it's
// needed (expanded, or opened for edit) and merges them into the
// in-memory record. Cheap: one row, fetched at most once per listing
// per page load.
async function ensureFullListing(id) {
  const item = listings.find((l) => l.id === id);
  if (item && item._full) return item;
  const { data, error } = await sb.from("listings").select("*").eq("id", id).single();
  if (error) { showError("Could not load full listing details: " + error.message); return item; }
  const merged = { ...item, ...data, _full: true };
  listings = listings.map((l) => (l.id === id ? merged : l));
  return merged;
}

function showError(msg) {
  const el = $("errBanner");
  if (!el) return;
  if (!msg) { el.style.display = "none"; return; }
  el.style.display = "block";
  el.textContent = msg;
}

// ---- Search logging (debounced) ----
function logSearchDebounced() {
  clearTimeout(searchLogTimer);
  searchLogTimer = setTimeout(logSearchNow, 800);
}
async function logSearchNow() {
  if (!session) return;
  const locationLabel = [...filterRegions, ...filterProvinces, ...filterCities].join(", ") || "All";
  const categoryLabelStr = filterCategoryLabels().join(", ") || "All";
  const statusLabelStr = filterStatuses.join(", ") || "All";
  const priceActive = priceMin !== null && priceMax !== null && !(priceMin === priceDataMin && priceMax === priceDataMax);
  const q = $("searchInput") ? $("searchInput").value.trim() : "";
  if (!q && filterRegions.length === 0 && filterProvinces.length === 0 && filterCities.length === 0 && filterCategories.length === 0 && filterStatuses.length === 0 && !priceActive) return; // skip logging empty/default state
  const resultsCount = totalCount;
  try {
    await sb.from("search_logs").insert({
      user_id: session.user.id,
      query_text: q,
      filter_location: locationLabel,
      filter_category: categoryLabelStr,
      filter_status: priceActive ? `${statusLabelStr} | Price ${Math.round(priceMin)}-${Math.round(priceMax)}` : statusLabelStr,
      results_count: resultsCount,
    });
  } catch (e) { console.error("search log failed", e); }
}

async function createListing(payload) {
  payload.selling_price_num = parsePrice(payload.selling_price);
  payload.ats_price_num = parsePrice(payload.ats_price);
  const { error } = await sb.from("listings").insert(payload);
  if (error) { showError("Could not save: " + error.message); return; }
  currentPage = 0;
  await computePriceBounds();
  renderPriceSlider(true);
  await loadListings(true);
}
async function updateListing(id, payload) {
  payload.selling_price_num = parsePrice(payload.selling_price);
  payload.ats_price_num = parsePrice(payload.ats_price);
  const { error } = await sb.from("listings").update({ ...payload, updated_at: new Date().toISOString() }).eq("id", id);
  if (error) { showError("Could not save: " + error.message); return; }
  await computePriceBounds();
  renderPriceSlider(true);
  await loadListings(true);
}
async function archiveListing(id) {
  if (!confirm("Archive this listing? It will be hidden from the main list, and can be restored or permanently deleted from the Archive tab.")) return;
  const { error } = await sb.from("listings").update({ archived: true, updated_at: new Date().toISOString() }).eq("id", id);
  if (error) { showError("Could not archive: " + error.message); return; }
  await computePriceBounds();
  renderPriceSlider(true);
  await loadListings(true);
}

async function exportCSV() {
  showError("");
  let data;
  try {
    let query = sb.from("listings").select("*").eq("archived", false);
    query = applyActiveFilters(query);
    query = query.order("created_at", { ascending: false }).limit(20000);
    const res = await query;
    if (res.error) throw res.error;
    data = res.data || [];
  } catch (e) {
    showError("Export failed: " + e.message);
    return;
  }
  const rows = data.map((l) => ({
    propertyCode: l.property_code, registrationDate: l.registration_date, ownerName: l.owner_name,
    contactNo: l.contact_no, address: l.address, municipality: l.municipality, barangay: l.barangay,
    category: categoryLabel(l.category), status: l.status,
    lotNo: l.lot_no, titleNo: l.title_no, taxDecNo: l.tax_dec_no, lotArea: l.lot_area,
    atsPrice: l.ats_price, sellingPrice: l.selling_price,
    siteLocator: l.site_locator, recruitedBy: l.recruited_by, unitManager: l.unit_manager,
    divisionManager: l.division_manager, subBroker: l.sub_broker,
    remarks: l.remarks || "", "Photo Link": l.photo_urls || "",
  }));
  const csv = Papa.unparse(rows);
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `mrbestbuy-listings-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

function handleImportFile(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  Papa.parse(file, {
    header: true, skipEmptyLines: true,
    complete: async (results) => {
      const rows = results.data.map((row) => {
        const rawCat = (row.category || row.Category || "raw_land").toString().toLowerCase();
        let category = "raw_land";
        if (rawCat.includes("house")) category = "house_and_lot";
        else if (rawCat.includes("commercial")) category = "commercial_lot";
        else if (rawCat.includes("industrial")) category = "industrial_lot";
        const rawStatus = row.status || row.Status || "Available";
        const rawLoc = row.municipality || row.Municipality || row.location || "Cebu City";
        return {
          property_code: (row.propertyCode || row["Property Code"] || "").toString().trim(),
          registration_date: (row.registrationDate || row["Registration Date"] || "").toString().trim() || null,
          owner_name: (row.ownerName || row["Owner's Name"] || "").toString().trim(),
          contact_no: (row.contactNo || row["Contact No"] || "").toString().trim(),
          address: (row.address || row.Address || "").toString().trim(),
          municipality: regionForMunicipality(rawLoc) !== "Other" ? rawLoc : "Cebu City",
          barangay: (row.barangay || row.Barangay || "").toString().trim(),
          category,
          status: STATUSES.includes(rawStatus) ? rawStatus : "Available",
          lot_no: (row.lotNo || row["Lot No"] || "").toString().trim(),
          title_no: (row.titleNo || row["Title No"] || "").toString().trim(),
          tax_dec_no: (row.taxDecNo || row["Tax Dec No"] || "").toString().trim(),
          lot_area: (row.lotArea || row["Lot Area"] || "").toString().trim(),
          ats_price: (row.atsPrice || row["ATS Price"] || "").toString().trim(),
          selling_price: (row.sellingPrice || row["Selling Price"] || "").toString().trim(),
          ats_price_num: parsePrice(row.atsPrice || row["ATS Price"] || ""),
          selling_price_num: parsePrice(row.sellingPrice || row["Selling Price"] || ""),
          site_locator: (row.siteLocator || row["Site Locator"] || "").toString().trim(),
          recruited_by: (row.recruitedBy || row["Recruited By"] || row["Recruiter"] || "").toString().trim(),
          unit_manager: (row.unitManager || row["Unit Manager"] || "").toString().trim(),
          division_manager: (row.divisionManager || row["Division Manager"] || "").toString().trim(),
          sub_broker: (row.subBroker || row["Sub Broker"] || "").toString().trim(),
          remarks: (row.remarks || row.Remarks || "").toString().trim(),
          photo_urls: (row.photoUrls || row["Photo URLs"] || row["Photo Link"] || row["Photo Links"] || "").toString().trim(),
        };
      }).filter((r) => r.property_code || r.owner_name);
      if (rows.length === 0) { alert('No valid rows found. Make sure the CSV has "propertyCode" or "ownerName" columns.'); return; }
      const nonDriveCount = rows.filter((r) => photoList(r.photo_urls).some((u) => !isDriveLink(u))).length;
      const photoWarning = nonDriveCount > 0
        ? `\n\nNote: ${nonDriveCount} row(s) have photo links that aren't Google Drive links — they'll be saved as-is but may not display correctly.`
        : "";
      if (confirm(`Import ${rows.length} listing(s)?${photoWarning}`)) {
        const { error } = await sb.from("listings").insert(rows);
        if (error) { showError("Import failed: " + error.message); return; }
        // Register any new agent names from this batch into the shared directory,
        // tagged with the role/type they were found under.
        const newEntries = new Map(); // name -> type (first occurrence wins)
        rows.forEach((r) => {
          ["site_locator", "recruited_by", "unit_manager", "division_manager", "sub_broker"].forEach((k) => {
            if (r[k] && !agentNames.includes(r[k]) && !newEntries.has(r[k])) newEntries.set(r[k], k);
          });
        });
        for (const [name, type] of newEntries) await createAgentEntry({ name, type });
        currentPage = 0;
        await computePriceBounds();
        renderPriceSlider(true);
        await loadListings(true);
      }
    },
    error: () => alert("Could not read that file. Please check it is a valid CSV."),
  });
  e.target.value = "";
}

function randomPassword() {
  const chars = "ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789";
  let out = "";
  for (let i = 0; i < 12; i++) out += chars[Math.floor(Math.random() * chars.length)];
  return out;
}

// Creates a brand-new agent login account WITHOUT disturbing the admin's
// own session. Uses the raw Auth REST endpoint directly (not sb.auth.signUp,
// which would swap the browser's active session to the new account).
async function adminCreateAgentAccount(email, password, fullName) {
  const res = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
    method: "POST",
    headers: { apikey: SUPABASE_ANON_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ email, password, data: { full_name: fullName } }),
  });
  const json = await res.json();
  if (!res.ok) throw new Error(json.msg || json.error_description || json.error || "Could not create account");
  const newId = (json.user && json.user.id) || json.id || null;
  return newId;
}

    accountsPage = 0;
    loadAccountsPage();
  });
  $("accountsPrevBtn").addEventListener("click", () => { if (accountsPage > 0) { accountsPage--; loadAccountsPage(); } });
  $("accountsNextBtn").addEventListener("click", () => { if (accountsPage < totalPages - 1) { accountsPage++; loadAccountsPage(); } });
}

// =====================================================================
// ADMIN: PENDING APPROVALS
// =====================================================================
async function renderApprovalsView() {
  const body = $("tabBody");
  body.innerHTML = `<div class="panel"><div id="approvalsList">Loading…</div></div>`;
  const { data, error } = await sb.from("profiles").select("*").eq("status", "pending").order("created_at", { ascending: true });
  if (error) { $("approvalsList").innerHTML = `<div class="errline">Could not load: ${escapeHtml(error.message)}</div>`; return; }
  pendingProfiles = data || [];
  const list = $("approvalsList");
  if (pendingProfiles.length === 0) {
    list.innerHTML = `<div class="empty"><h3>No pending requests</h3><p>New agent signups will show up here for approval.</p></div>`;
    return;
  }
  list.innerHTML = pendingProfiles.map((p) => `
    <div class="card">
      <div class="card-row">
        <div>
          <div style="font-family:Georgia,serif; font-size:15px; color:#163832;">${escapeHtml(p.full_name || "(no name given)")}</div>
          <div style="font-size:12.5px; color:#6B6558;">${escapeHtml(p.email)} · requested ${new Date(p.created_at).toLocaleDateString()}</div>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn secondary" data-approve-agent="${p.id}">Approve as Agent</button>
          <button class="btn ghost" data-approve-admin="${p.id}">Approve as Admin</button>
          <button class="btn danger" data-reject="${p.id}">Reject</button>
        </div>
      </div>
    </div>`).join("");

  list.querySelectorAll("[data-approve-agent]").forEach((btn) => btn.addEventListener("click", () => setProfileStatus(btn.dataset.approveAgent, "approved", "agent")));
  list.querySelectorAll("[data-approve-admin]").forEach((btn) => btn.addEventListener("click", () => setProfileStatus(btn.dataset.approveAdmin, "approved", "admin")));
  list.querySelectorAll("[data-reject]").forEach((btn) => btn.addEventListener("click", () => setProfileStatus(btn.dataset.reject, "rejected", "agent")));
}
async function setProfileStatus(id, status, role) {
  const { error } = await sb.from("profiles").update({ status, role }).eq("id", id);
  if (error) { alert("Could not update: " + error.message); return; }
  renderApprovalsView();
}

// =====================================================================
// ADMIN: SEARCH REPORTS
// =====================================================================
async function renderReportsView() {
  const body = $("tabBody");
  body.innerHTML = `<div class="panel"><div id="reportsBody">Loading…</div></div>`;

  // Aggregates computed IN the database (see search-reports-rpc.sql) —
  // only ever a handful of rows come back, regardless of log volume.
  const [locRes, catRes, userRes] = await Promise.all([
    sb.rpc("top_search_locations", { limit_count: 5 }),
    sb.rpc("top_search_categories", { limit_count: 5 }),
    sb.rpc("top_search_users", { limit_count: 5 }),
  ]);
  if (locRes.error) { $("reportsBody").innerHTML = `<div class="errline">Could not load report: ${escapeHtml(locRes.error.message)}</div>`; return; }

  const topLocations = (locRes.data || []).map((r) => [r.label, r.cnt]);
  const topCategories = (catRes.data || []).map((r) => [categoryLabel(r.label) || r.label, r.cnt]);
  const topUserRows = userRes.data || [];

  // Names for the small set of user_ids in the "Most Active Agents" card —
  // fetched by exact id list, never the whole profiles table.
  let profilesById2 = {};
  if (topUserRows.length) {
    const ids = topUserRows.map((r) => r.user_id);
    const { data: profs } = await sb.from("profiles").select("id, email, full_name").in("id", ids);
    (profs || []).forEach((p) => { profilesById2[p.id] = p; });
  }
  const nameFor2 = (id) => { const p = profilesById2[id]; return p ? (p.full_name || p.email) : "(unknown)"; };
  const topUsers = topUserRows.map((r) => [nameFor2(r.user_id), r.cnt]);

  const statCardsHtml = (title, rows, empty) => `
    <div class="stat-card">
      <div class="lbl">${title}</div>
      ${rows.length === 0 ? `<div style="font-size:12.5px;color:#6B6558;margin-top:8px;">${empty}</div>` :
        rows.map(([k, v]) => `<div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;"><span>${escapeHtml(k)}</span><b style="color:#163832;">${v}</b></div>`).join("")}
    </div>`;

  $("reportsBody").innerHTML = `
    <div class="stat-cards">
      ${statCardsHtml("Top Searched Locations", topLocations, "No location filters used yet")}
      ${statCardsHtml("Top Searched Categories", topCategories, "No category filters used yet")}
      ${statCardsHtml("Most Active Agents", topUsers, "No activity yet")}
    </div>
    <div class="card">
      <div style="font-family:Georgia,serif; color:#163832; font-size:15px; margin-bottom:10px;">Recent Search Activity</div>
      <div style="overflow-x:auto;" id="reportsTableWrap">Loading…</div>
      <div id="reportsPaginationRow"></div>
    </div>
  `;

  reportsPage = 0;
  await loadReportsPage();
}

// Only the current page's raw log rows are ever fetched — the summary
// cards above come entirely from the RPC aggregates, not from this data.
async function loadReportsPage() {
  const wrap = $("reportsTableWrap");
  if (!wrap) return;
  const { data, error, count } = await sb.from("search_logs").select("*", { count: "exact" })
    .order("searched_at", { ascending: false })
    .range(reportsPage * reportsPageSize, reportsPage * reportsPageSize + reportsPageSize - 1);
  if (error) { wrap.innerHTML = `<div class="errline">Could not load activity: ${escapeHtml(error.message)}</div>`; return; }
  reportsTotalCount = count || 0;
  const rows = data || [];

  if (reportsTotalCount === 0) {
    wrap.innerHTML = `<div class="empty"><h3>No search activity yet</h3><p>Once agents start searching and filtering, activity will show up here.</p></div>`;
    $("reportsPaginationRow").innerHTML = "";
    return;
  }

  const ids = [...new Set(rows.map((l) => l.user_id).filter(Boolean))];
  let namesById = {};
  if (ids.length) {
    const { data: profs } = await sb.from("profiles").select("id, email, full_name").in("id", ids);
    (profs || []).forEach((p) => { namesById[p.id] = p.full_name || p.email; });
  }

  wrap.innerHTML = `
    <table class="logtable">
      <thead><tr><th>When</th><th>Agent</th><th>Query</th><th>Location</th><th>Category</th><th>Status</th><th>Results</th></tr></thead>
      <tbody>
        ${rows.map((l) => `
          <tr>
            <td>${new Date(l.searched_at).toLocaleString()}</td>
            <td>${escapeHtml(namesById[l.user_id] || "(unknown)")}</td>
            <td>${escapeHtml(l.query_text) || "—"}</td>
            <td>${escapeHtml(l.filter_location)}</td>
            <td>${l.filter_category ? escapeHtml(l.filter_category) : "All"}</td>
            <td>${escapeHtml(l.filter_status)}</td>
            <td>${l.results_count}</td>
          </tr>`).join("")}
      </tbody>
    </table>`;
  renderReportsPagination();
}

function renderReportsPagination() {
  const row = $("reportsPaginationRow");
  if (!row) return;
  const totalPages = Math.max(1, Math.ceil(reportsTotalCount / reportsPageSize));
  const startItem = reportsPage * reportsPageSize + 1;
  const endItem = Math.min(reportsTotalCount, (reportsPage + 1) * reportsPageSize);
  row.innerHTML = `
    <div class="pagination-inner" style="margin-top:12px;">
      <span>Showing ${startItem}–${endItem} of ${reportsTotalCount}</span>
      <div class="pagination-controls">
        <label>Per page
          <select id="reportsPageSizeSelect" class="field">
            ${[10, 25, 50, 100].map((n) => `<option value="${n}" ${n === reportsPageSize ? "selected" : ""}>${n}</option>`).join("")}
          </select>
        </label>
        <button class="btn ghost" id="reportsPrevBtn" ${reportsPage <= 0 ? "disabled" : ""}>‹ Prev</button>
        <span class="page-indicator">Page ${reportsPage + 1} of ${totalPages}</span>
        <button class="btn ghost" id="reportsNextBtn" ${reportsPage >= totalPages - 1 ? "disabled" : ""}>Next ›</button>
      </div>
    </div>`;
  $("reportsPageSizeSelect").addEventListener("change", (e) => {
    reportsPageSize = parseInt(e.target.value, 10);
    reportsPage = 0;
    loadReportsPage();
  });
  $("reportsPrevBtn").addEventListener("click", () => { if (reportsPage > 0) { reportsPage--; loadReportsPage(); } });
  $("reportsNextBtn").addEventListener("click", () => { if (reportsPage < totalPages - 1) { reportsPage++; loadReportsPage(); } });
}


// =====================================================================
// BOOT / AUTH STATE
// =====================================================================
async function boot() {
  const { data: { session: s } } = await sb.auth.getSession();
  session = s;
  if (!session) { renderAuth(); return; }
  await loadProfileAndRender();
}

async function loadProfileAndRender() {
  const { data, error } = await sb.from("profiles").select("*").eq("id", session.user.id).single();
  if (error || !data) {
    // profile row not created yet (trigger race) — brief retry
    setTimeout(loadProfileAndRender, 800);
    return;
  }
  profile = data;
  if (profile.status !== "approved") renderPending();
  else renderApp();
}

sb.auth.onAuthStateChange((event, s) => {
  session = s;
  if (!session) { profile = null; renderAuth(); return; }
  loadProfileAndRender();
});

if (SUPABASE_URL.includes("PASTE_YOUR") || SUPABASE_ANON_KEY.includes("PASTE_YOUR")) {
  $("root").innerHTML = `<div class="auth-wrap"><h1>Setup needed</h1><p style="font-size:13px;color:#6B6558;">Open this file and paste your Supabase URL and anon key at the top before using.</p></div>`;
} else {
  boot();
}
</script>
